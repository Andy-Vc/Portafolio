<header
    class="fixed inset-x-0 top-0 z-50 border-b border-surface-border bg-surface-navbar backdrop-blur-md"
>
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:h-20 sm:px-6 lg:px-8">
        <button
            type="button"
            appScrollToSection="inicio"
            (click)="setActiveSection('inicio')"
            class="group flex items-center gap-3 focus-ring"
            aria-label="Ir al inicio"
        >
            <span class="text-sm font-semibold tracking-[0.18em] text-foreground-primary">
                AV
            </span>
            <span class="hidden h-3 w-px bg-surface-border sm:block"></span>
            <span class="hidden text-xs font-medium text-foreground-muted sm:block">
                Andy Valdivia
            </span>
        </button>

        <nav class="relative hidden items-stretch gap-8 lg:flex" aria-label="Navegación principal">
            @for (link of links; track link.href) {
            <button
                #navLink
                [attr.data-section]="link.href.slice(1)"
                type="button"
                [appScrollToSection]="link.href.slice(1)"
                (click)="setActiveSection(link.href.slice(1))"
                class="relative py-6 text-sm font-medium transition-colors duration-300 focus-ring"
                [ngClass]="activeSection() === link.href.slice(1)
                    ? 'font-semibold text-brand'
                    : 'text-foreground-muted hover:text-foreground-primary'"
                [attr.aria-current]="activeSection() === link.href.slice(1) ? 'page' : null"
            >
                {{ link.label }}
            </button>
            }
            <span
                class="pointer-events-none absolute bottom-0 h-px bg-brand"
                [style.left.px]="indicatorLeft()"
                [style.width.px]="indicatorWidth()"
                style="transition: left 250ms ease, width 250ms ease;"
            ></span>
        </nav>

        <div class="flex items-center gap-2">
            <button
                type="button"
                class="relative inline-flex h-10 w-10 items-center justify-center text-foreground-secondary transition-[color,opacity] duration-300 hover:text-brand focus-ring"
                (click)="themeService.toggleTheme()"
                [attr.aria-label]="themeService.theme() === 'dark'
                    ? 'Cambiar a modo claro'
                    : 'Cambiar a modo oscuro'"
                [attr.aria-pressed]="themeService.theme() === 'dark'"
                title="Cambiar tema"
            >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round"
                    class="absolute h-[22px] w-[22px] transition-opacity duration-250"
                    [class.opacity-100]="themeService.theme() === 'dark'"
                    [class.opacity-0]="themeService.theme() !== 'dark'"
                    aria-hidden="true">
                    <path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z" />
                </svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round"
                    class="absolute h-[22px] w-[22px] transition-opacity duration-250"
                    [class.opacity-100]="themeService.theme() === 'light'"
                    [class.opacity-0]="themeService.theme() !== 'light'"
                    aria-hidden="true">
                    <circle cx="12" cy="12" r="3.5" />
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" />
                </svg>
            </button>

            <button
                type="button"
                class="relative inline-flex h-10 w-10 items-center justify-center text-foreground-primary transition-colors duration-300 hover:text-brand lg:hidden focus-ring"
                (click)="toggleMenu()"
                [attr.aria-expanded]="menuOpen()"
                aria-controls="mobile-menu"
                aria-label="Abrir menú de navegación"
            >
                <span class="relative h-4 w-5">
                    <span class="absolute left-[5px] top-[5px] h-px w-[14px] bg-current"></span>
                    <span class="absolute left-[5px] top-[8px] h-px w-[14px] bg-current"></span>
                    <span class="absolute left-[5px] top-[11px] h-px w-[14px] bg-current"></span>
                </span>
            </button>
        </div>
    </div>

</header>

@if (menuVisible()) {
<div
    class="fixed inset-0 z-[60] lg:hidden"
    [class.pointer-events-none]="!menuOpen()"
    [attr.aria-hidden]="!menuOpen()"
>
    <button
        type="button"
        class="mobile-menu-backdrop absolute inset-0 h-full w-full bg-surface/70"
        [class.is-open]="menuOpen()"
        (click)="closeMenu()"
        aria-label="Cerrar menú"
        tabindex="-1"
    ></button>

    <aside
        id="mobile-menu"
        class="mobile-menu-panel absolute inset-y-0 right-0 flex w-[min(88vw,24rem)] flex-col border-l border-surface-border bg-surface shadow-none"
        [class.is-open]="menuOpen()"
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="menuOpen() ? 'Menú de navegación' : null"
    >
        <div class="flex h-16 shrink-0 items-center justify-between border-b border-surface-border px-5 sm:h-20 sm:px-6">
            <button
                type="button"
                appScrollToSection="inicio"
                (click)="setActiveSection('inicio'); closeMenu()"
                class="flex items-center gap-3 focus-ring"
                aria-label="Ir al inicio"
            >
                <span class="text-sm font-semibold tracking-[0.18em] text-foreground-primary">AV</span>
                <span class="h-4 w-px bg-surface-border"></span>
                <span class="text-sm font-medium text-foreground-primary">Andy Valdivia</span>
            </button>

            <div class="flex items-center gap-1">
                <button
                    type="button"
                    class="inline-flex h-10 w-10 items-center justify-center text-foreground-secondary transition-colors duration-300 hover:text-brand focus-ring"
                    (click)="themeService.toggleTheme()"
                    [attr.aria-label]="themeService.theme() === 'dark'
                        ? 'Cambiar a modo claro'
                        : 'Cambiar a modo oscuro'"
                    [attr.aria-pressed]="themeService.theme() === 'dark'"
                    title="Cambiar tema"
                >
                    @if (themeService.theme() === 'dark') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                        stroke-linecap="round" stroke-linejoin="round" class="h-[22px] w-[22px]" aria-hidden="true">
                        <path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z" />
                    </svg>
                    } @else {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                        stroke-linecap="round" stroke-linejoin="round" class="h-[22px] w-[22px]" aria-hidden="true">
                        <circle cx="12" cy="12" r="3.5" />
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" />
                    </svg>
                    }
                </button>

                <button
                    type="button"
                    class="inline-flex h-10 w-10 items-center justify-center text-foreground-primary transition-colors duration-300 hover:text-brand focus-ring"
                    (click)="closeMenu()"
                    aria-label="Cerrar menú"
                >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                        stroke-linecap="round" stroke-linejoin="round" class="h-[22px] w-[22px]" aria-hidden="true">
                        <path d="M5 5l14 14M19 5L5 19" />
                    </svg>
                </button>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto px-5 py-4 sm:px-6" aria-label="Navegación móvil">
            @for (link of links; track link.href) {
            <button
                type="button"
                [appScrollToSection]="link.href.slice(1)"
                (click)="setActiveSection(link.href.slice(1)); closeMenu()"
                class="flex w-full items-center justify-between border-b border-surface-border py-5 text-left text-base font-medium transition-colors duration-300 focus-ring"
                [ngClass]="activeSection() === link.href.slice(1)
                    ? 'font-semibold text-brand'
                    : 'text-foreground-secondary hover:text-foreground-primary'"
                [attr.aria-current]="activeSection() === link.href.slice(1) ? 'page' : null"
            >
                <span>{{ link.label }}</span>
                <span
                    class="h-px w-5 bg-brand transition-opacity duration-300"
                    [class.opacity-100]="activeSection() === link.href.slice(1)"
                    [class.opacity-0]="activeSection() !== link.href.slice(1)"
                ></span>
            </button>
            }
        </nav>
    </aside>
</div>
}
